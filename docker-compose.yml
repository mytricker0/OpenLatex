services:
  sharelatex:
    restart: always
    # Server Pro users:
    # image: quay.io/sharelatex/sharelatex-pro
    image: sharelatex/sharelatex
    container_name: sharelatex
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
      dockerproxy:
        condition: service_started
    ports:
      - 80:80
    stop_grace_period: 60s
    volumes:
      - ~/sharelatex_data:/var/lib/overleaf
      ########################################################################
      ####  Sandboxed Compiles reach the docker daemon through the         ####
      ####  least-privilege `dockerproxy` service below (DOCKER_HOST env), ####
      ####  NOT by mounting the raw docker socket into this container.     ####
      ####  Never add `- /var/run/docker.sock:/var/run/docker.sock` here:  ####
      ####  it grants trivial host root to anyone who compromises the app. ####
      ########################################################################
    environment:
      OVERLEAF_APP_NAME: Overleaf Community Edition

      OVERLEAF_MONGO_URL: mongodb://mongo/sharelatex

      # Same property, unfortunately with different names in
      # different locations
      OVERLEAF_REDIS_HOST: redis
      REDIS_HOST: redis

      # IMPORTANT: Required for invite token generation
      # OVERLEAF_INVITE_TOKEN_SECRET: generate with `openssl rand -base64 32`

      ENABLED_LINKED_FILE_TYPES: "project_file,project_output_file"

      # Enables Thumbnail generation using ImageMagick
      ENABLE_CONVERSIONS: "true"

      # Disables email confirmation requirement
      EMAIL_CONFIRMATION_DISABLED: "true"

      ## Set for SSL via nginx-proxy
      #VIRTUAL_HOST: 103.112.212.22

      # OVERLEAF_SITE_URL: http://overleaf.example.com
      # OVERLEAF_NAV_TITLE: Overleaf Community Edition
      # OVERLEAF_HEADER_IMAGE_URL: http://example.com/mylogo.png
      # OVERLEAF_ADMIN_EMAIL: support@it.com

      # OVERLEAF_LEFT_FOOTER: '[{"text": "Another page I want to link to can be found <a href=\"here\">here</a>"} ]'
      # OVERLEAF_RIGHT_FOOTER: '[{"text": "Hello I am on the Right"} ]'

      # OVERLEAF_EMAIL_FROM_ADDRESS: "hello@example.com"

      # OVERLEAF_EMAIL_AWS_SES_ACCESS_KEY_ID:
      # OVERLEAF_EMAIL_AWS_SES_SECRET_KEY:

      # OVERLEAF_EMAIL_SMTP_HOST: smtp.example.com
      # OVERLEAF_EMAIL_SMTP_PORT: 587
      # OVERLEAF_EMAIL_SMTP_SECURE: false
      # OVERLEAF_EMAIL_SMTP_USER:
      # OVERLEAF_EMAIL_SMTP_PASS:
      # OVERLEAF_EMAIL_SMTP_TLS_REJECT_UNAUTH: true
      # OVERLEAF_EMAIL_SMTP_IGNORE_TLS: false
      # OVERLEAF_EMAIL_SMTP_NAME: '127.0.0.1'
      # OVERLEAF_EMAIL_SMTP_LOGGER: true
      # OVERLEAF_CUSTOM_EMAIL_FOOTER: "This system is run by department x"

      # ENABLE_CRON_RESOURCE_DELETION: true

      ################
      ## Server Pro ##
      ################

      ## Sandboxed Compiles run each LaTeX compile in its own isolated docker
      ## container (network disabled, all capabilities dropped, seccomp
      ## filtered). Requires the docker socket mount above and an image built
      ## from this repository. The host dir variables must point at the
      ## host-side paths of the compiles/output data dirs mounted above.
      SANDBOXED_COMPILES: "true"
      ### Bind-mount source for /var/lib/overleaf/data/compiles inside the container.
      SANDBOXED_COMPILES_HOST_DIR_COMPILES: "${HOME}/sharelatex_data/data/compiles"
      ### Bind-mount source for /var/lib/overleaf/data/output inside the container.
      SANDBOXED_COMPILES_HOST_DIR_OUTPUT: "${HOME}/sharelatex_data/data/output"
      ### Backwards compatibility (before Server Pro 5.5)
      DOCKER_RUNNER: "true"
      SANDBOXED_COMPILES_SIBLING_CONTAINERS: "true"
      ### Reach the daemon via the least-privilege proxy, not the raw socket.
      DOCKER_HOST: "tcp://dockerproxy:2375"
      ### The image compiles run in. Keep in sync with ALLOWED_IMAGES below.
      ### SECURITY: pin to a digest (image@sha256:...) and update regularly —
      ### the 2017.1 default ships years-old ghostscript/poppler/freetype with
      ### known CVEs that a malicious document can reach.
      TEXLIVE_IMAGE: "quay.io/sharelatex/texlive-full:2017.1"
      ### Restrict which compile images may run (defence-in-depth on top of the
      ### web-side allowlist).
      ALLOWED_IMAGES: "quay.io/sharelatex/texlive-full:2017.1"
      ### Strongest per-compile isolation: run compiles under a sandboxed
      ### runtime (gVisor `runsc` or `sysbox-runc`) when installed on the host.
      ### Leave unset to use the default runc.
      # DOCKER_RUNTIME: "runsc"

      ## Works with test LDAP server shown at bottom of docker compose
      # OVERLEAF_LDAP_URL: 'ldap://ldap:389'
      # OVERLEAF_LDAP_SEARCH_BASE: 'ou=people,dc=planetexpress,dc=com'
      # OVERLEAF_LDAP_SEARCH_FILTER: '(uid={{username}})'
      # OVERLEAF_LDAP_BIND_DN: 'cn=admin,dc=planetexpress,dc=com'
      # OVERLEAF_LDAP_BIND_CREDENTIALS: 'GoodNewsEveryone'
      # OVERLEAF_LDAP_EMAIL_ATT: 'mail'
      # OVERLEAF_LDAP_NAME_ATT: 'cn'
      # OVERLEAF_LDAP_LAST_NAME_ATT: 'sn'
      # OVERLEAF_LDAP_UPDATE_USER_DETAILS_ON_LOGIN: 'true'

      # OVERLEAF_TEMPLATES_USER_ID: "578773160210479700917ee5"
      # OVERLEAF_NEW_PROJECT_TEMPLATE_LINKS: '[ {"name":"All Templates","url":"/templates/all"}]'

      # OVERLEAF_PROXY_LEARN: "true"

  # Least-privilege mediator in front of the docker daemon for Sandboxed
  # Compiles. The app talks to this over the internal network (DOCKER_HOST)
  # instead of mounting /var/run/docker.sock directly. Only the container and
  # image APIs needed to launch compile containers are enabled; exec, volumes,
  # networks, swarm, secrets and the daemon socket itself are denied.
  #
  # NOTE: this limits the *API surface* (and gives an audit point), but a
  # process that can create containers can still request a privileged one.
  # For true host isolation also run compiles under a sandboxed runtime
  # (DOCKER_RUNTIME=runsc/sysbox-runc) and keep registration invite-only.
  dockerproxy:
    restart: always
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: dockerproxy
    environment:
      CONTAINERS: 1   # create/start/wait/kill/remove/inspect compile containers
      IMAGES: 1       # inspect/pull the texlive image
      POST: 1         # allow the POST verbs the above paths need
      INFO: 1
      PING: 1
      VERSION: 1
      # everything else denied (default 0): EXEC, VOLUMES, NETWORKS, SWARM,
      # SERVICES, TASKS, SECRETS, CONFIGS, PLUGINS, SYSTEM, BUILD, COMMIT, AUTH
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /run

  mongo:
    restart: always
    image: mongo:8.0
    container_name: mongo
    command: "--replSet overleaf"
    volumes:
      - ~/mongo_data:/data/db
      - ./bin/shared/mongodb-init-replica-set.js:/docker-entrypoint-initdb.d/mongodb-init-replica-set.js
    environment:
      MONGO_INITDB_DATABASE: sharelatex
    extra_hosts:
      # Required when using the automatic database setup for initializing the replica set.
      # This override is not needed when running the setup after starting up mongo.
      - mongo:127.0.0.1
    healthcheck:
      test: echo 'db.stats().ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5

  redis:
    restart: always
    image: redis:6.2
    container_name: redis
    volumes:
      - ~/redis_data:/data

  # ldap:
  #    restart: always
  #    image: rroemhild/test-openldap
  #    container_name: ldap

  # See https://github.com/jwilder/nginx-proxy for documentation on how to configure the nginx-proxy container,
  # and https://github.com/overleaf/overleaf/wiki/HTTPS-reverse-proxy-using-Nginx for an example of some recommended
  # settings. We recommend using a properly managed nginx instance outside of the Overleaf Server Pro setup,
  # but the example here can be used if you'd prefer to run everything with docker compose

  # nginx-proxy:
  #     image: jwilder/nginx-proxy
  #     container_name: nginx-proxy
  #     ports:
  #       - "80:80"
  #       - "443:443"
  #     volumes:
  #       - /var/run/docker.sock:/tmp/docker.sock:ro
  #       - /home/overleaf/tmp:/etc/nginx/certs
