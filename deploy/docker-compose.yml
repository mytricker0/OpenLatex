# OpenLatex production deployment.
#
# Security model:
#  - Compiles are sandboxed: each LaTeX run executes in its own per-compile
#    container under the gVisor (runsc) runtime, reached via a least-privilege
#    docker-socket-proxy (the app never mounts the raw docker socket). Network
#    disabled, all caps dropped, read-only rootfs, non-root, resource-capped.
#    REQUIRES gVisor on the host: `sudo bash develop/bin/install-gvisor.sh`.
#    To run without it (CE LocalCommandRunner, unsandboxed) set
#    SANDBOXED_COMPILES=false in deploy/.env and keep registration invite-only.
#  - mongo/redis on an internal-only network; no-new-privileges everywhere;
#    resource limits so a TeX bomb cannot take down the host; the web port is
#    only reachable via nginx-proxy-manager on npm-network (never published).
#  - Secrets (session, invite token) come from deploy/.env (gitignored);
#    compose refuses to start if they are unset. See deploy/.env.example.

services:
    openlatex:
        image: openlatex:latest
        build:
            context: ..
            dockerfile: server-ce/Dockerfile
        container_name: openlatex
        restart: unless-stopped
        depends_on:
            mongo:
                condition: service_healthy
            redis:
                condition: service_started
            dockerproxy:
                condition: service_started
        stop_grace_period: 60s
        # No host port: nginx-proxy-manager reaches port 80 over npm-network.
        expose:
            - "80"
        volumes:
            # Absolute host path so the per-compile sibling containers can
            # bind-mount the same compiles/output dirs (the docker daemon needs
            # the host-side path, not the in-container one).
            - ${OPENLATEX_DATA_DIR:?set OPENLATEX_DATA_DIR in deploy/.env}/openlatex:/var/lib/overleaf
            - openlatex-texlive:/usr/share/texlive
            - openlatex-texlive-local:/usr/local/texlive
        networks:
            - npm-network
            - openlatex-internal
        security_opt:
            - no-new-privileges:true
        deploy:
            resources:
                limits:
                    cpus: "3.0"
                    memory: 4g
        environment:
            OVERLEAF_APP_NAME: OpenLatex
            OVERLEAF_SITE_URL: https://openlatex.dev
            OVERLEAF_NAV_TITLE: OpenLatex
            OVERLEAF_BEHIND_PROXY: "true"
            OVERLEAF_SECURE_COOKIE: "true"

            OVERLEAF_MONGO_URL: mongodb://mongo/openlatex
            OVERLEAF_REDIS_HOST: redis
            REDIS_HOST: redis

            ENABLED_LINKED_FILE_TYPES: "project_file,project_output_file"
            ENABLE_CONVERSIONS: "true"
            EMAIL_CONFIRMATION_DISABLED: "true"

            # --- Transactional email (Brevo SMTP) ---
            # Open signup sends an activation email; without working SMTP the
            # account is created but the user can never set a password. Creds
            # come from deploy/.env. Brevo free tier = 300 emails/day, matched
            # by the signup cap in the user-activate module.
            OVERLEAF_EMAIL_FROM_ADDRESS: ${OVERLEAF_EMAIL_FROM_ADDRESS:-noreply@openlatex.dev}
            OVERLEAF_EMAIL_SMTP_HOST: ${OVERLEAF_EMAIL_SMTP_HOST:-smtp-relay.brevo.com}
            OVERLEAF_EMAIL_SMTP_PORT: ${OVERLEAF_EMAIL_SMTP_PORT:-587}
            OVERLEAF_EMAIL_SMTP_SECURE: ${OVERLEAF_EMAIL_SMTP_SECURE:-false}
            OVERLEAF_EMAIL_SMTP_USER: ${OVERLEAF_EMAIL_SMTP_USER:-}
            OVERLEAF_EMAIL_SMTP_PASS: ${OVERLEAF_EMAIL_SMTP_PASS:-}

            # --- Optional: reCAPTCHA on signup/login (defence vs bot signups
            # and activation-email spam). Inert until both keys are set. ---
            RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-}
            RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}

            # --- Secrets (deploy/.env, gitignored). Compose fails if unset. ---
            OVERLEAF_INVITE_TOKEN_SECRET: ${OVERLEAF_INVITE_TOKEN_SECRET:?set in deploy/.env — openssl rand -base64 32}
            SESSION_SECRET: ${SESSION_SECRET:?set in deploy/.env — openssl rand -base64 32}

            # --- Sandboxed compiles (per-compile gVisor sibling containers) ---
            # Reaches the daemon through the dockerproxy below, not the raw
            # socket. Set SANDBOXED_COMPILES=false in deploy/.env to opt out.
            SANDBOXED_COMPILES: ${SANDBOXED_COMPILES:-true}
            DOCKER_RUNNER: ${SANDBOXED_COMPILES:-true}
            DOCKER_RUNTIME: ${DOCKER_RUNTIME:-runsc}
            DOCKER_HOST: tcp://dockerproxy:2375
            # Pin to a digest in production (texlive/texlive:...@sha256:...).
            TEXLIVE_IMAGE: ${TEXLIVE_IMAGE:-texlive/texlive:latest-small}
            ALLOWED_IMAGES: ${TEXLIVE_IMAGE:-texlive/texlive:latest-small}
            TEXLIVE_IMAGE_USER: ${TEXLIVE_IMAGE_USER:-1000}
            SANDBOXED_COMPILES_HOST_DIR_COMPILES: ${OPENLATEX_DATA_DIR:?set OPENLATEX_DATA_DIR in deploy/.env}/openlatex/data/compiles
            SANDBOXED_COMPILES_HOST_DIR_OUTPUT: ${OPENLATEX_DATA_DIR:?set OPENLATEX_DATA_DIR in deploy/.env}/openlatex/data/output

    # Least-privilege mediator in front of the docker daemon so the app never
    # mounts the raw socket. Only container + image APIs enabled; exec,
    # volumes, networks, swarm, secrets denied; socket mounted read-only.
    dockerproxy:
        image: tecnativa/docker-socket-proxy:0.3.0
        container_name: openlatex-dockerproxy
        restart: unless-stopped
        environment:
            CONTAINERS: 1
            IMAGES: 1
            POST: 1
            INFO: 1
            PING: 1
            VERSION: 1
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
        read_only: true
        tmpfs:
            - /run
        networks:
            - openlatex-internal
        security_opt:
            - no-new-privileges:true
        deploy:
            resources:
                limits:
                    cpus: "0.5"
                    memory: 128m

    mongo:
        image: mongo:6.0
        container_name: openlatex-mongo
        restart: unless-stopped
        command: "--replSet overleaf"
        volumes:
            - ../data/mongo:/data/db
            - ../bin/shared/mongodb-init-replica-set.js:/docker-entrypoint-initdb.d/mongodb-init-replica-set.js:ro
        environment:
            MONGO_INITDB_DATABASE: openlatex
        healthcheck:
            test: echo 'db.stats().ok' | mongosh localhost:27017/test --quiet
            interval: 10s
            timeout: 10s
            retries: 5
        networks:
            - openlatex-internal
        security_opt:
            - no-new-privileges:true
        deploy:
            resources:
                limits:
                    cpus: "1.0"
                    memory: 1g

    redis:
        image: redis:6.2
        container_name: openlatex-redis
        restart: unless-stopped
        volumes:
            - ../data/redis:/data
        networks:
            - openlatex-internal
        security_opt:
            - no-new-privileges:true
        read_only: true
        tmpfs:
            - /tmp
        deploy:
            resources:
                limits:
                    cpus: "0.5"
                    memory: 512m

networks:
    npm-network:
        external: true
    openlatex-internal:
        driver: bridge
        internal: true

volumes:
    openlatex-texlive:
    openlatex-texlive-local:
